[project]
name = "jarvis-v1"
version = "0.1.0"
description = "Self-hosted Raspberry Pi voice assistant foundation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "google-genai>=1.0",
    "numpy>=1.26",
    "openwakeword>=0.6",
    "requests>=2.31",
    "sounddevice>=0.4.6",
]

[project.scripts]
jarvis = "jarvis.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that call external services or require hardware",
]
