services:
  jarvis:
    build:
      context: .
    image: jarvis-v1:phase1
    restart: unless-stopped
    environment:
      JARVIS_LOG_LEVEL: ${JARVIS_LOG_LEVEL:-INFO}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_STT_MODEL: ${SARVAM_STT_MODEL:-saaras:v3}
      SARVAM_STT_MODE: ${SARVAM_STT_MODE:-transcribe}
      SARVAM_STT_LANGUAGE_CODE: ${SARVAM_STT_LANGUAGE_CODE:-unknown}
      SARVAM_STT_TIMEOUT_SECONDS: ${SARVAM_STT_TIMEOUT_SECONDS:-30}
      JARVIS_LLM_PROVIDER: ${JARVIS_LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_REQUEST_TIMEOUT_SECONDS: ${GEMINI_REQUEST_TIMEOUT_SECONDS:-30}
      JARVIS_PERSONALITY: ${JARVIS_PERSONALITY:-indian_casual}
      JARVIS_HUMOR_LEVEL: ${JARVIS_HUMOR_LEVEL:-2}
      JARVIS_PROMPT_DEBUG: ${JARVIS_PROMPT_DEBUG:-false}
      JARVIS_AUDIO_DEVICE: ${JARVIS_AUDIO_DEVICE:-}
      JARVIS_AUDIO_OUTPUT_DEVICE: ${JARVIS_AUDIO_OUTPUT_DEVICE:-}
      JARVIS_SAMPLE_RATE: ${JARVIS_SAMPLE_RATE:-16000}
      JARVIS_CHANNELS: ${JARVIS_CHANNELS:-1}
      JARVIS_CHUNK_SIZE: ${JARVIS_CHUNK_SIZE:-1280}
      JARVIS_AUDIO_FLUSH_DURATION_MS: ${JARVIS_AUDIO_FLUSH_DURATION_MS:-300}
      JARVIS_ACK_AUDIO_PATH: ${JARVIS_ACK_AUDIO_PATH:-/app/assets/audio/acknowledgement.wav}
      JARVIS_WAKEWORD_MODEL: ${JARVIS_WAKEWORD_MODEL:-hey_jarvis}
      JARVIS_WAKEWORD_THRESHOLD: ${JARVIS_WAKEWORD_THRESHOLD:-0.5}
      JARVIS_WAKEWORD_COOLDOWN_MS: ${JARVIS_WAKEWORD_COOLDOWN_MS:-1500}
      JARVIS_WAKEWORD_RESUME_DELAY_MS: ${JARVIS_WAKEWORD_RESUME_DELAY_MS:-1500}
      JARVIS_WAKEWORD_RESET_DURATION_MS: ${JARVIS_WAKEWORD_RESET_DURATION_MS:-1500}
      JARVIS_QUERY_MAX_DURATION_SECONDS: ${JARVIS_QUERY_MAX_DURATION_SECONDS:-30}
      JARVIS_QUERY_NO_SPEECH_TIMEOUT_SECONDS: ${JARVIS_QUERY_NO_SPEECH_TIMEOUT_SECONDS:-5}
      JARVIS_SILENCE_DURATION_MS: ${JARVIS_SILENCE_DURATION_MS:-1000}
      JARVIS_SPEECH_START_THRESHOLD: ${JARVIS_SPEECH_START_THRESHOLD:-500}
      JARVIS_QUERY_TEMP_DIR: ${JARVIS_QUERY_TEMP_DIR:-/tmp/jarvis}
      JARVIS_CLEANUP_QUERY_AUDIO: ${JARVIS_CLEANUP_QUERY_AUDIO:-true}
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
